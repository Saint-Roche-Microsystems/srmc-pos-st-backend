services:
  api:
    build: .
    container_name: srmc_pos_api
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/srmc_pos
    depends_on:
      - mongo
    restart: unless-stopped
  mongo:
    image: mongo:latest
    container_name: mongo_srmcdb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: srmc_pos
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data: