services:
  caddy:
    image: caddy:latest
    container_name: srmc_pos_caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: srmc-pos.vieerr.xyz
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: .
    container_name: srmc_pos_api
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/srmc_pos
    depends_on:
      - mongo
    restart: unless-stopped
  mongo:
    image: mongo:latest
    container_name: mongo_srmcdb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: srmc_pos
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  mongo_data: