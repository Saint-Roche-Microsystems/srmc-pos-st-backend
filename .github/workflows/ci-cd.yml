name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run tests
        run: npm test

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Create Route53 DNS record
        run: |
          DOMAIN="srmc-pos.vieerr.xyz"
          ZONE_ID="${{ secrets.ROUTE53_ZONE_ID }}"
          EC2_IP="${{ secrets.EC2_HOST }}"
          
          # Check if record exists, if not create it
          EXISTING=$(aws route53 list-resource-record-sets \
            --hosted-zone-id "$ZONE_ID" \
            --query "ResourceRecordSets[?Name=='${DOMAIN}.'].ResourceRecords[0].Value" \
            --output text 2>/dev/null || echo "")
          
          if [ -z "$EXISTING" ] || [ "$EXISTING" != "$EC2_IP" ]; then
            aws route53 change-resource-record-sets \
              --hosted-zone-id "$ZONE_ID" \
              --change-batch "{
                \"Changes\": [{
                  \"Action\": \"UPSERT\",
                  \"ResourceRecordSet\": {
                    \"Name\": \"${DOMAIN}\",
                    \"Type\": \"A\",
                    \"TTL\": 300,
                    \"ResourceRecords\": [{\"Value\": \"${EC2_IP}\"}]
                  }
                }]
              }"
            echo "DNS record created/updated"
          fi

      - name: Deploy to EC2 and setup HTTPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            APP_DIR="$HOME/srmc-pos-st-backend"
            REPO_URL="https://github.com/${{ github.repository }}.git"
            
            # Clone/update repo
            if [ ! -d "$APP_DIR/.git" ]; then
              mkdir -p "$APP_DIR"
              git clone "$REPO_URL" "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch --all
            git reset --hard origin/main
            
            # Ensure mongo is running (don't rebuild)
            if docker ps | grep mongo_srmcdb >/dev/null 2>&1; then
              echo "Mongo container already running"
            else
              if docker compose version >/dev/null 2>&1; then
                sudo docker compose up -d mongo
              else
                sudo docker-compose up -d mongo
              fi
            fi
            
            # Force remove old api container
            sudo docker rm -f srmc_pos_api 2>/dev/null || true
            
            # Build and run new api container
            if docker compose version >/dev/null 2>&1; then
              sudo docker compose up -d --no-deps --build api
            else
              sudo docker-compose up -d --no-deps --build api
            fi
            
            # Setup HTTPS on first deployment or if script changed
            if [ ! -f $HOME/.https-configured ] || [ scripts/init-https.sh -nt $HOME/.https-configured ]; then
              chmod +x scripts/init-https.sh
              sudo bash scripts/init-https.sh
              touch $HOME/.https-configured
            else
              # Just reload nginx
              sudo nginx -t && sudo systemctl reload nginx
            fi

      - name: Publish service URL
        run: |
          echo "## Backend URL" >> $GITHUB_STEP_SUMMARY
          echo "✅ https://srmc-pos.vieerr.xyz" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: Deployed and running with HTTPS" >> $GITHUB_STEP_SUMMARY
